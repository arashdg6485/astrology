name: Build APK and Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            echo "SDKMANAGER=${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          elif [ -x "${SDK_ROOT}/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "${SDK_ROOT}/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
            echo "SDKMANAGER=${SDK_ROOT}/cmdline-tools/16.0/bin/sdkmanager" >> "$GITHUB_ENV"
          else
            echo "sdkmanager was not found in the preinstalled Android SDK" >&2
            find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses >/dev/null

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"
          test -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          "$SDKMANAGER" --version

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
          cache-read-only: false

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/IrisResearchAnalyzer-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "release/IrisResearchAnalyzer-v1.0.${GITHUB_RUN_NUMBER}.apk" \
            --title "IrisResearchAnalyzer $TAG" \
            --notes "Android APK built automatically from commit ${GITHUB_SHA}."

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IrisResearchAnalyzer-debug-apk
          path: release/*.apk
          if-no-files-found: error
